services:
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: oreamo
      POSTGRES_USER: oreamo
      POSTGRES_PASSWORD: 1q2w3e4r!
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oreamo -d oreamo"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:8
    ports:
      - "6379:6379"
  localstack:
    image: localstack/localstack:4.14.0
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ap-northeast-2
    volumes:
      - ./oreamo-api/docker/localstack/init:/etc/localstack/init/ready.d
  web:
    image: oreamo-app-web:1.0.0
    build: ./oreamo-web
    ports:
      - "3000:3000"
    depends_on:
      - api
  api:
    image: oreamo-app-api:1.0.0
    build: ./oreamo-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/oreamo
      SPRING_DATA_REDIS_HOST: redis
      AWS_S3_ENDPOINT: http://localstack:4566
      APP_AGENT_BASEURL: http://agent:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      localstack:
        condition: service_started
  agent:
    image: oreamo-app-agent:1.0.0
    build: ./oreamo-agent
    ports:
      - "8000:8000"
    env_file:
      - ./oreamo-agent/.env.local
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      AWS_S3_ENDPOINT: http://localstack:4566
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      localstack:
        condition: service_started
