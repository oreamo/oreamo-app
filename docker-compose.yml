services:
  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: oreamo
      POSTGRES_PASSWORD: 1q2w3e4r!
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oreamo"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
  localstack:
    image: localstack/localstack:4.14.0
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ap-northeast-2
    volumes:
      - ./oreamo-backend/docker/localstack/init:/etc/localstack/init/ready.d
  frontend:
    build: ./oreamo-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
  backend:
    build: ./oreamo-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/oreamo
      SPRING_DATA_REDIS_HOST: redis
      AWS_S3_ENDPOINT: http://localstack:4566
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      localstack:
        condition: service_started
  agent:
    build: ./oreamo-agent
    ports:
      - "8000:8000"
    env_file:
      - ./oreamo-agent/.env.local
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      AWS_S3_ENDPOINT: http://localstack:4566
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      localstack:
        condition: service_started
