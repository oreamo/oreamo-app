name: Check Agent

on:
  pull_request:
    branches: [develop]
    paths:
      - "oreamo-agent/**"
      - ".github/workflows/check-agent.yml"
  push:
    branches: [develop]
    paths:
      - "oreamo-agent/**"
      - ".github/workflows/check-agent.yml"

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen --directory oreamo-agent

      - name: Lint
        run: make lint agent

      - name: Format
        run: make format agent

      - name: Type check
        run: make build agent
