name: Check Agent

on:
  pull_request:
    branches: [develop]
    paths:
      - "oreamo-agent/**"
      - ".github/workflows/check-agent.yml"
  push:
    branches: [develop]
    paths:
      - "oreamo-agent/**"
      - ".github/workflows/check-agent.yml"

defaults:
  run:
    working-directory: oreamo-agent

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint, format and type check
        run: make check
