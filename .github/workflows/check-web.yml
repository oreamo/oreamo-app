name: Check Web

on:
  pull_request:
    branches: [develop]
    paths:
      - "oreamo-web/**"
      - ".github/workflows/check-web.yml"
  push:
    branches: [develop]
    paths:
      - "oreamo-web/**"
      - ".github/workflows/check-web.yml"

defaults:
  run:
    working-directory: oreamo-web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v5
        with:
          node-version: 25
          cache: pnpm
          cache-dependency-path: oreamo-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Type check
        run: pnpm exec tsc -b
