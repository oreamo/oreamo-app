name: Check API

on:
  pull_request:
    branches: [develop]
    paths:
      - "oreamo-api/**"
      - ".github/workflows/check-api.yml"
  push:
    branches: [develop]
    paths:
      - "oreamo-api/**"
      - ".github/workflows/check-api.yml"

defaults:
  run:
    working-directory: oreamo-api

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile and format
        run: ./gradlew compileJava spotlessCheck
