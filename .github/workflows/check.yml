name: Check

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      agent: ${{ steps.filter.outputs.agent }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - "api/**"
              - ".github/workflows/check.yml"
            web:
              - "web/**"
              - ".github/workflows/check.yml"
            agent:
              - "agent/**"
              - ".github/workflows/check.yml"

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: api/gradlew -p api compileJava

      - name: Format
        run: make format api

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v5
        with:
          node-version: 25
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir web install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: make lint web

      - name: Format
        run: make format web

      - name: Type check
        run: pnpm --dir web exec tsc -b

  agent:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen --directory agent

      - name: Lint
        run: make lint agent

      - name: Format
        run: make format agent

      - name: Type check
        run: make build agent

  check:
    needs: [api, web, agent]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
