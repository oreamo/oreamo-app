[project]
name = "oreamo"
version = "0.1.0"
description = "Agent server for Oreamo"
requires-python = ">=3.14"
dependencies = [
    "aiomysql>=0.3.2",
    "alembic==1.18.4",
    "cryptography>=50.0.2",
    "fastapi>=0.135.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "redis>=7.4.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "uvicorn[standard]>=0.43.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.20",
    "ty>=0.0.56",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
