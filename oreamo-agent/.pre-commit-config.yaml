repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff-check
        entry: make lint-fix
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff-format
        entry: make format
        language: system
        types: [python]
        pass_filenames: false
